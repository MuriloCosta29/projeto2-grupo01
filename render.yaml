services:
  - type: web
    name: presidente-de-rua-api
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: cd src && gunicorn core.wsgi:application
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      # Troque pelo domínio real do front no Vercel (ex.: https://pilar.vercel.app)
      - key: CORS_ALLOWED_ORIGIN
        value: "https://SEU-FRONT.vercel.app"
      - key: PYTHON_VERSION
        value: "3.13.5"
